<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paginateller</title>
<style>
  :root{
    --paper:#EDEEE9; --card:#F8F8F5; --ink:#1B2430; --ink-soft:#5F6B76;
    --ink-faint:#8D97A0; --rule:#CDD1C9; --rule-soft:#DFE2DB;
    --accent:#2C4A7C; --flag:#8C3A2E; --ok:#3E6B55;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding:14px 16px 24px}

  .title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink-soft)}

  .counter{margin:10px 0 0;padding:14px 0 12px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);
           display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .odo{display:flex;align-items:baseline;gap:10px}
  .odo-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(38px,13vw,60px);
           line-height:.86;font-weight:600;letter-spacing:-.02em}
  .odo-unit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .tallies{display:flex;gap:18px;padding-bottom:4px}
  .tally-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
  .tally-num.flag{color:var(--flag)}
  .tally-lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

  .listhead{display:grid;grid-template-columns:1fr 66px 20px;gap:8px;margin-top:16px;padding-bottom:6px;
            border-bottom:1px solid var(--ink);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
  .listhead span:nth-child(2){text-align:right}
  .row{display:grid;grid-template-columns:1fr 66px 20px;gap:8px;align-items:center;padding:8px 0;
       border-bottom:1px solid var(--rule-soft)}
  .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .sub{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)}
  .pg{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:right}
  .pg.busy{color:var(--ink-faint);font-weight:400}
  .pg.err{color:var(--flag);font-size:11px;font-weight:500}
  .pg.est{color:var(--accent)}
  .mark{font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-align:center}

  .empty{padding:26px 0;text-align:center;color:var(--ink-faint);font-size:13px}
  .note{margin-top:12px;font-size:11.5px;color:var(--ink-soft)}
  .note b{color:var(--flag);font-weight:600}
  .foot{margin-top:16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .foot .spacer{flex:1}
  .toast{font-size:11.5px;color:var(--ok)}
  button{font:inherit;font-size:12px;padding:7px 12px;cursor:pointer;background:transparent;color:var(--ink);
         border:1px solid var(--rule);border-radius:2px}
  button.solid{background:var(--ink);color:var(--card);border-color:var(--ink)}
  button:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .banner{margin-top:12px;padding:9px 12px;border-left:3px solid var(--flag);background:#F6EFED;font-size:12px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="title">Paginateller · bijlagen</div>

<div class="counter">
  <div class="odo">
    <div class="odo-num" id="total" aria-live="polite">0</div>
    <div class="odo-unit">pagina's<br>totaal</div>
  </div>
  <div class="tallies">
    <div><div class="tally-num" id="nFiles">0</div><div class="tally-lbl">bijlagen</div></div>
    <div><div class="tally-num" id="nBusy">0</div><div class="tally-lbl">bezig</div></div>
    <div><div class="tally-num" id="nErr">0</div><div class="tally-lbl">geen telling</div></div>
  </div>
</div>

<div id="banner"></div>

<div class="listhead"><span>bijlage</span><span>pagina's</span><span></span></div>
<div id="list"><div class="empty">Bezig met laden…</div></div>

<div class="note" id="note"></div>

<div class="foot">
  <button class="solid" id="refresh">Opnieuw tellen</button>
  <button id="copy" disabled>Lijst kopiëren</button>
  <span class="spacer"></span>
  <span class="toast" id="toast"></span>
</div>

<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
  "use strict";

  var PDFJS = window.pdfjsLib || null;
  if (PDFJS) {
    PDFJS.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  var $ = function(id){ return document.getElementById(id); };
  var rows = [], shownTotal = 0;

  /* ================= tellers per bestandstype ================= */

  function bytesFromBase64(b64){
    var bin = atob(b64), n = bin.length, out = new Uint8Array(n);
    for (var i = 0; i < n; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // PDF — exact via pdf.js, met byte-scan als terugval
  function countPdf(bytes){
    if (!PDFJS) return Promise.resolve(scanPdf(bytes));
    return PDFJS.getDocument({data: bytes, disableFontFace:true, isEvalSupported:false})
      .promise.then(function(doc){
        var n = doc.numPages; doc.destroy();
        return {n:n, unit:"pag.", est:false};
      })
      .catch(function(err){
        if (err && err.name === "PasswordException") throw new Error("beveiligd");
        return scanPdf(bytes);
      });
  }
  function scanPdf(bytes){
    var txt = new TextDecoder("latin1").decode(bytes), best = 0, m;
    var re = /\/Type\s*\/Pages[\s\S]{0,600}?\/Count\s+(\d+)/g;
    while ((m = re.exec(txt))) best = Math.max(best, parseInt(m[1],10));
    if (!best){ var rp = /\/Type\s*\/Page[^s]/g, c = 0; while (rp.exec(txt)) c++; best = c; }
    if (!best) throw new Error("onleesbaar");
    return {n:best, unit:"pag.", est:true};
  }

  // TIFF — tel de IFD-keten (meerpagina-scans)
  function countTiff(bytes){
    var le;
    if (bytes[0] === 0x49 && bytes[1] === 0x49) le = true;
    else if (bytes[0] === 0x4D && bytes[1] === 0x4D) le = false;
    else throw new Error("onleesbaar");
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var off = dv.getUint32(4, le), pages = 0, guard = 0;
    while (off && off + 2 <= bytes.byteLength && guard++ < 20000){
      pages++;
      var entries = dv.getUint16(off, le);
      var next = off + 2 + entries * 12;
      if (next + 4 > bytes.byteLength) break;
      off = dv.getUint32(next, le);
    }
    if (!pages) throw new Error("onleesbaar");
    return {n:pages, unit:"pag.", est:false};
  }

  // OOXML — paginateller uit docProps/app.xml (door Word/PowerPoint bijgehouden)
  function countOoxml(bytes, kind){
    if (!window.JSZip) throw new Error("n.v.t.");
    return JSZip.loadAsync(bytes).then(function(zip){
      var f = zip.file("docProps/app.xml");
      if (!f) throw new Error("geen telling");
      return f.async("string").then(function(xml){
        var tag = kind === "pptx" ? "Slides" : "Pages";
        var m = new RegExp("<" + tag + ">(\\d+)</" + tag + ">").exec(xml);
        if (!m) throw new Error("geen telling");
        return {n: parseInt(m[1],10), unit: kind === "pptx" ? "dia's" : "pag.", est:true};
      });
    });
  }

  // ZIP — tel de PDF's, TIFF's en afbeeldingen erin op
  function countZip(bytes){
    if (!window.JSZip) throw new Error("n.v.t.");
    return JSZip.loadAsync(bytes).then(function(zip){
      var jobs = [];
      zip.forEach(function(path, entry){
        if (entry.dir) return;
        var ext = (path.split(".").pop() || "").toLowerCase();
        if (["pdf","tif","tiff","jpg","jpeg","png"].indexOf(ext) === -1) return;
        jobs.push(entry.async("uint8array").then(function(b){
          if (ext === "pdf") return countPdf(b).then(function(r){ return r.n; });
          if (ext === "tif" || ext === "tiff") return countTiff(b).n;
          return 1;
        }).catch(function(){ return 0; }));
      });
      if (!jobs.length) throw new Error("geen documenten");
      return Promise.all(jobs).then(function(list){
        var sum = list.reduce(function(a,b){ return a+b; }, 0);
        return {n:sum, unit:"pag. in zip", est:true};
      });
    });
  }

  function countAttachment(name, bytes){
    var ext = (name.split(".").pop() || "").toLowerCase();
    if (ext === "pdf")  return Promise.resolve(countPdf(bytes));
    if (ext === "tif" || ext === "tiff") return Promise.resolve(countTiff(bytes));
    if (ext === "docx" || ext === "dotx") return countOoxml(bytes, "docx");
    if (ext === "pptx" || ext === "potx") return countOoxml(bytes, "pptx");
    if (ext === "zip")  return countZip(bytes);
    if (["jpg","jpeg","png","gif","bmp","webp","heic"].indexOf(ext) !== -1)
      return Promise.resolve({n:1, unit:"pag.", est:false});
    return Promise.reject(new Error("n.v.t."));
  }

  /* ================= weergave ================= */

  function animateTo(el, from, to){
    if (from === to || window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      el.textContent = to; return;
    }
    var t0 = performance.now();
    (function step(now){
      var p = Math.min(1, (now - t0)/360), e = 1 - Math.pow(1-p,3);
      el.textContent = Math.round(from + (to-from)*e);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  function esc(s){ return String(s).replace(/[&<>]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

  function fmtSize(b){
    if (!b && b !== 0) return "";
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b/1024).toFixed(0) + " kB";
    return (b/1048576).toFixed(1) + " MB";
  }

  function render(){
    var pages = 0, busy = 0, err = 0, est = 0;
    rows.forEach(function(r){
      if (r.state === "ok"){ pages += r.n; if (r.est) est++; }
      else if (r.state === "busy") busy++;
      else err++;
    });

    animateTo($("total"), shownTotal, pages); shownTotal = pages;
    $("nFiles").textContent = rows.length;
    $("nBusy").textContent = busy;
    var e = $("nErr"); e.textContent = err; e.className = "tally-num" + (err ? " flag" : "");

    if (!rows.length){
      $("list").innerHTML = '<div class="empty">Geen bijlagen in dit bericht.</div>';
    } else {
      $("list").innerHTML = rows.map(function(r){
        var cls = "pg", txt, mark = "";
        if (r.state === "busy"){ cls += " busy"; txt = "…"; }
        else if (r.state === "ok"){
          if (r.est){ cls += " est"; mark = "~"; }
          txt = r.n;
        } else { cls += " err"; txt = r.msg; }
        return '<div class="row">' +
          '<div><div class="nm" title="' + esc(r.name) + '">' + esc(r.name) + '</div>' +
          '<div class="sub">' + fmtSize(r.size) + (r.state==="ok" ? " · " + r.unit : "") + '</div></div>' +
          '<div class="' + cls + '">' + esc(txt) + '</div>' +
          '<div class="mark">' + mark + '</div></div>';
      }).join("");
    }

    var notes = [];
    if (est) notes.push("~ = uit de documenteigenschappen, niet opnieuw doorgerekend.");
    if (err) notes.push("<b>" + err + " bijlage(n) zonder telling</b> tellen niet mee.");
    $("note").innerHTML = notes.join(" ");
    $("copy").disabled = !rows.length;
  }

  /* ================= bijlagen ophalen ================= */

  function getContent(id){
    return new Promise(function(res, rej){
      Office.context.mailbox.item.getAttachmentContentAsync(id, function(r){
        if (r.status === Office.AsyncResultStatus.Succeeded) res(r.value);
        else rej(new Error("niet op te halen"));
      });
    });
  }

  function handle(r, att){
    return getContent(att.id).then(function(v){
      if (v.format !== Office.MailboxEnums.AttachmentContentFormat.Base64)
        throw new Error("n.v.t.");
      return countAttachment(r.name, bytesFromBase64(v.content));
    }).then(function(res){
      r.state = "ok"; r.n = res.n; r.unit = res.unit; r.est = res.est;
    }).catch(function(err){
      r.state = "error";
      r.msg = (err && err.message) ? err.message : "geen telling";
    }).then(render);
  }

  function listAttachments(){
    var item = Office.context.mailbox.item;
    if (item.attachments) return Promise.resolve(item.attachments);          // leesmodus
    if (item.getAttachmentsAsync){                                            // opstelmodus
      return new Promise(function(res){
        item.getAttachmentsAsync(function(r){
          res(r.status === Office.AsyncResultStatus.Succeeded ? (r.value || []) : []);
        });
      });
    }
    return Promise.resolve([]);
  }

  function run(){
    rows = []; shownTotal = 0; $("total").textContent = "0";
    $("list").innerHTML = '<div class="empty">Bezig met laden…</div>';
    $("banner").innerHTML = "";

    listAttachments().then(function(atts){
      var jobs = [];
      (atts || []).forEach(function(att){
        if (att.isInline) return;
        if (att.attachmentType === Office.MailboxEnums.AttachmentType.Item) return;
        var r = {name:att.name, size:att.size, state:"busy", n:0, unit:"", est:false, msg:""};
        rows.push(r);
        jobs.push(function(){ return handle(r, att); });
      });
      render();

      // maximaal 3 tegelijk, zodat grote bijlagen het paneel niet blokkeren
      var i = 0, running = 0;
      (function pump(){
        while (running < 3 && i < jobs.length){
          running++;
          jobs[i++]().then(function(){ running--; pump(); });
        }
      })();
    }).catch(function(){
      $("banner").innerHTML = '<div class="banner">De bijlagen konden niet gelezen worden. ' +
        'Controleer of het bericht volledig geladen is en probeer opnieuw.</div>';
      render();
    });
  }

  $("refresh").onclick = run;

  $("copy").onclick = function(){
    var total = rows.reduce(function(a,r){ return a + (r.state === "ok" ? r.n : 0); }, 0);
    var txt = rows.map(function(r){
      return r.name + "\t" + (r.state === "ok" ? (r.est ? "~" : "") + r.n : r.msg);
    }).join("\n") + "\nTOTAAL\t" + total;
    navigator.clipboard.writeText(txt).then(function(){
      $("toast").textContent = "Gekopieerd.";
      setTimeout(function(){ $("toast").textContent = ""; }, 2000);
    }, function(){
      $("toast").textContent = "Kopiëren lukte niet.";
      setTimeout(function(){ $("toast").textContent = ""; }, 2000);
    });
  };

  Office.onReady(function(info){
    if (info.host !== Office.HostType.Outlook){
      $("banner").innerHTML = '<div class="banner">Dit paneel hoort in Outlook te draaien.</div>';
      return;
    }
    run();
    if (Office.context.mailbox.addHandlerAsync && Office.EventType.ItemChanged){
      Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, run);
    }
  });
})();
</script>
</body>
</html>
